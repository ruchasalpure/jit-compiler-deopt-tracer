spec_version: "0.1.0"
name: jit-compiler-deopt-tracer
version: 1.0.0
description: Profiles V8 and HotSpot JIT compiler trace streams to detect polymorphic call sites, hidden class transitions, and runaway deoptimization bailouts.
author: "Rucha Salpure"
license: MIT
model:
  preferred: claude-opus-4-6
  fallback:
    - claude-sonnet-4-5-20250929
  constraints:
    temperature: 0.2
    max_tokens: 4096
skills:
  - polymorphic-inline-cache-analysis
tools: []
delegation:
  mode: auto
runtime:
  max_turns: 50
  timeout: 300
compliance:
  risk_tier: standard
  frameworks: []
tags:
  - devtools
  - autonomous-agent
  - opengap-verified
metadata:
  repository: "https://github.com/ruchasalpure/jit-compiler-deopt-tracer"
